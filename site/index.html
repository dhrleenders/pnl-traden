<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>PnL Traden</title>
<style>
body{font-family:sans-serif;background:#0b1220;color:#e6ebff;margin:0}
.tabs{display:flex;gap:8px;padding:12px;background:#0f1a33}
.tab{padding:8px 12px;border-radius:8px;background:#1b2a55;cursor:pointer}
.view{display:none;padding:16px}
.panel{background:#0f1a33;border-radius:16px;padding:16px}
.pill{background:#223a7a;color:#fff;border:none;padding:8px 12px;border-radius:999px;cursor:pointer}
</style>
</head>
<body>
<div id="tabs" class="tabs">
<div class="tab" data-view="dash">Dash</div>
<div class="tab" data-view="analyse">Analyse</div>
<div class="tab" data-view="trades">Trades</div>
<div class="tab" data-view="calc">Calc</div>
<div class="tab" data-view="import">Import</div>
<div class="tab" data-view="coach">Coach</div>
</div>

<section id="view-dash" class="view">Dashboard</section>
<section id="view-analyse" class="view">Analyse</section>
<section id="view-trades" class="view">Trades</section>
<section id="view-calc" class="view">Calc</section>
<section id="view-import" class="view">Import</section>

<section id="view-coach" class="view">
<div class="panel">
<h2>Coach</h2>
<button id="btnCoachUpdate" class="pill">Update coach</button>
<div id="coachStatus">Nog niet geladen</div>
<pre id="coachPreview"></pre>
</div>
</section>

<script src="components/coach_feed.js"></script>
<script src="app.js"></script>
</body>
</html>
